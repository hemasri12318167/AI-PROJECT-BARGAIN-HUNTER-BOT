<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bargain Hunter Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <header class="bg-gradient-to-r from-green-400 to-blue-500 text-white py-6 shadow">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold">🛍️ Bargain Hunter Bot</h1>
      <span class="text-sm">Powered by Gemini & SerpApi</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto py-10 px-4">
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-2xl font-semibold mb-4">Find the Best Deals Online</h2>
      <form id="query-form" class="flex gap-2 mb-6">
        <input type="text" id="user-query" class="flex-grow px-4 py-2 border rounded-xl focus:outline-none focus:ring focus:border-blue-300" placeholder="Search for a product (e.g., iPhone under 50k)" required>
        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-xl">Search</button>
      </form>
      <div id="bot-response" class="text-gray-800 space-y-2"></div>
    </div>
  </main>

  <footer class="text-center py-6 text-sm text-gray-500">
    &copy; 2025 Bargain Hunter. Built with ❤️ using Gemini + SerpApi + Flask
  </footer>

  <script>
    const form = document.getElementById('query-form');
    const responseBox = document.getElementById('bot-response');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = document.getElementById('user-query').value;
      responseBox.innerHTML = `<p class="text-blue-500">🔎 Searching for: <strong>${query}</strong>...</p>`;

      try {
        const res = await fetch('/gemini_query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const data = await res.json();
        responseBox.innerHTML = `<div class="bg-green-100 p-4 rounded-xl"><strong>🛍️ Bargain Hunter says:</strong><br>${data.response.replaceAll('\n', '<br>')}</div>`;
      } catch (err) {
        responseBox.innerHTML = `<p class="text-red-500">⚠️ Something went wrong while fetching the deal.</p>`;
      }
    });
  </script>
</body>
</html>
